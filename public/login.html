<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

    <div class="container">

        <h1>Sign in</h1>

        <p class="subtitle">

            Continue to Chat App

        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

            <button
            type="button"

            class="link-btn"

            onclick="goToRegister()">

                Create account

            </button>

        </form>

    </div>

    <script src="login.js"></script>

</body>

</html>
