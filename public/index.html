<!DOCTYPE html>
<html>

<head>
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-box">

        <ul id="messages"></ul>

        <form id="form">

            <input
                id="input"
                placeholder="Type message..."
                autocomplete="off"
            />

            <button>Send</button>

        </form>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="script.js"></script>

</body>

</html>
