<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

    <div class="container">

        <h1>Create account</h1>

        <p class="subtitle">

            Register to continue

        </p>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">

                Register

            </button>

            <button
            type="button"

            class="link-btn"

            onclick="goToLogin()">

                Back to login

            </button>

        </form>

    </div>

    <script src="register.js"></script>

</body>

</html>
